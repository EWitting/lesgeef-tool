[project]
name = "lesgeefplanner"
version = "0.2.0"
description = "Lesgeefplanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "openpyxl>=3.1.5",
    "ortools>=9.14.6206",
    "pandas>=2.3.2",
    "platformdirs>=4.3.0",
    "pydantic>=2.10.4",
    "python-levenshtein>=0.27.1",
    "pyyaml>=6.0.2",
    "xlsxwriter>=3.2.5",
    "nicegui>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
lesgeefplanner = "lesgeefplanner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesgeefplanner"]
